name: SEPA Daily Scan

on:
  schedule:
    - cron: '30 9 * * 1-5'    # 한국 18:30 (한국 마감 후)
    - cron: '30 21 * * 1-5'   # 한국 06:30 (미국 마감 후)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # 지난 실행에서 만든 대시보드를 복원한다.
      # 이게 없으면 날짜 선택 목록에 오늘 것만 남는다.
      - name: Restore history
        uses: actions/cache@v4
        with:
          path: output
          key: sepa-output-${{ github.run_id }}
          restore-keys: sepa-output-

      - name: Run scan
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python run_daily.py --market ALL --min-rs 90 --no-open

      - name: Build site
        run: |
          mkdir -p site
          # 최근 30일치만 유지
          ls -t output/SEPA대시보드_*.html 2>/dev/null | head -30 | while read f; do
            cp "$f" site/
          done
          cp output/*.pdf site/ 2>/dev/null || true
          latest=$(ls -t site/SEPA대시보드_*.html | head -1)
          cp "$latest" site/index.html
          echo "배포 파일:"
          ls -la site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
