name: SEPA Daily Scan

on:
  schedule:
    - cron: '20 22 * * 0-4'   # KST 07:20 (한국 장 시작 전) — UTC 일~목 22:20
    - cron: '30 7 * * 1-5'    # KST 16:30 (한국 장 마감 후) — UTC 월~금 07:30
  workflow_dispatch:
    inputs:
      session:
        description: '세션 구분 (수동 실행 시 표시될 이름)'
        required: false
        default: 'MANUAL'
        type: choice
        options: [AM, PM, MANUAL]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TZ: Asia/Seoul          # 모든 step의 date 출력을 KST로 통일

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Ubuntu 러너에는 한글 폰트가 없다. 설치하지 않으면 reportlab 이
      # 한글 글리프를 임베딩하지 못해 PDF 리포트의 한글이 깨진다.
      # ("임베딩 가능한 한글 폰트를 찾지 못했습니다" 경고가 이 경우다)
      - name: Install Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum fonts-noto-cjk
          fc-cache -f
          echo "설치된 한글 폰트:"
          fc-list :lang=ko family | sort -u | head -10

      - run: pip install -r requirements.txt

      # 어떤 cron이 이 실행을 트리거했는지로 장전/장마감을 자동 판별한다.
      # 수동 실행(workflow_dispatch)이면 위에서 고른 선택지를 쓴다.
      - name: Determine session
        id: session
        run: |
          if [ "${{ github.event.schedule }}" = "20 22 * * 0-4" ]; then
            echo "value=AM" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 7 * * 1-5" ]; then
            echo "value=PM" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.session || 'MANUAL' }}" >> "$GITHUB_OUTPUT"
          fi

      # ──────────────────────────────────────────────────────────────
      # 실행 지연 감지
      # Actions는 부하가 몰리면 예약 실행을 수십 분~수 시간 미룬다.
      # AM 세션이 09:00(장 시작) 이후로 밀리면 FDR이 당일 미완성 봉을
      # 반환해 "전일 종가" 전제가 깨진다. 그 상황을 로그에 남긴다.
      # ──────────────────────────────────────────────────────────────
      - name: Check start time (KST)
        id: starttime
        run: |
          echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "=============================================="
          echo " 세션        : ${{ steps.session.outputs.value }}"
          echo " 시작 시각   : $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo " 예정 시각   : AM 07:20 / PM 16:30 (KST)"
          echo "=============================================="
          HHMM=$(date +%H%M)
          if [ "${{ steps.session.outputs.value }}" = "AM" ] && [ "$HHMM" -ge "0850" ]; then
            echo "::warning::AM 세션이 $HHMM 에 시작됐습니다. 장 시작(09:00)에 근접하거나 이미 지났습니다. 당일 장중 시세가 섞일 수 있습니다."
          fi

      # ──────────────────────────────────────────────────────────────
      # 목록 캐시 복원
      # cache/kr_listing.* 은 KRX 종목 목록의 마지막 성공본이다.
      # 러너는 매번 새로 뜨므로, 이전 실행이 history/ 와 함께 커밋해 둔
      # 캐시를 checkout 시점에 받아와야 "FDR·pykrx 둘 다 막혔을 때
      # 예전 캐시라도 쓴다"는 kr_data_fdr.py의 마지막 방어선이 실제로
      # 작동한다. 이 스텝이 없으면 그 방어선은 매번 무력화된다.
      # ──────────────────────────────────────────────────────────────
      - name: Restore listing cache
        run: |
          mkdir -p cache
          if ls cache/kr_listing.* >/dev/null 2>&1; then
            age=$(( ( $(date +%s) - $(date -r cache/kr_listing.* +%s | head -1) ) / 86400 ))
            echo "저장소에 커밋된 종목 목록 캐시 발견 (${age}일 전 것)"
          else
            echo "커밋된 종목 목록 캐시 없음 — 이번이 첫 성공 실행에서 새로 만들어집니다."
          fi
          if ls cache/kr_krx_daily.* >/dev/null 2>&1; then
            size=$(du -h cache/kr_krx_daily.* 2>/dev/null | head -1 | cut -f1)
            echo "저장소에 커밋된 KRX 일별시세 캐시 발견 (${size})"
          else
            echo "커밋된 KRX 일별시세 캐시 없음 — 이번 실행에서 처음부터(약 280영업일) 채웁니다."
          fi

      # 장전(AM) 세션은 데이터 기준일을 직전 영업일로 못박는다.
      # 이렇게 하면 실행이 몇 시에 시작되든, 스캔이 몇 시간 걸리든
      # 결과가 동일하다. 시각에 의존하는 구조를 없애는 것이 핵심이다.
      # 파일명·표지 날짜는 오늘 그대로 유지된다(--date 가 아니라 --data-date).
      - name: Run scan
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          EXTRA=""
          if [ "${{ steps.session.outputs.value }}" = "AM" ]; then
            PREV=$(python -c "import pandas as pd; print((pd.Timestamp.now(tz='Asia/Seoul').normalize() - pd.tseries.offsets.BDay(1)).strftime('%Y%m%d'))")
            echo "장전 세션 — 데이터 기준일을 $PREV 종가로 고정합니다."
            EXTRA="--data-date $PREV"
          fi
          python run_daily.py --market ALL --min-rs 90 --no-open \
            --session ${{ steps.session.outputs.value }} $EXTRA

      # 스캔이 09:00을 넘겨 끝났으면 뒤쪽 종목에 장중 시세가 섞인다.
      # 전 종목이 아니라 "조회 순서상 뒤쪽 종목만" 오염되므로 눈에 잘 안 띈다.
      - name: Check finish time (KST)
        run: |
          ELAPSED=$(( $(date +%s) - ${{ steps.starttime.outputs.start_epoch }} ))
          echo "=============================================="
          echo " 종료 시각   : $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo " 소요 시간   : $((ELAPSED / 60))분 $((ELAPSED % 60))초"
          echo "=============================================="
          HHMM=$(date +%H%M)
          if [ "${{ steps.session.outputs.value }}" = "AM" ] && [ "$HHMM" -ge "0900" ]; then
            echo "::error::AM 스캔이 $HHMM 에 종료됐습니다. 장 시작 이후까지 실행되어 일부 종목에 당일 장중 시세가 반영됐을 가능성이 높습니다. 이 회차 결과는 전일 종가 기준이 아닙니다."
          fi

      # history/ 는 캐시가 아니라 저장소에 직접 커밋한다.
      # 캐시는 만료·초기화될 수 있어 "날짜별 조회"가 끊기는 원인이 됐었다.
      #
      # cache/kr_listing.* 도 같은 이유로 함께 커밋한다. FDR과 pykrx가
      # 동시에 막히는 사고가 실제로 있었고(2026-09-09), 그때 목록 캐시가
      # 저장소에 없어 "예전 캐시라도 쓴다"는 마지막 방어선까지 무너졌다.
      #
      # cache/kr_krx_daily.* 는 KRX Open API 날짜별 조회(고속 경로)가
      # 쌓아온 281영업일치 시세 캐시다. 이걸 커밋하지 않으면 러너가
      # 새로 뜰 때마다 사라져, 매번 280여 일을 처음부터 다시 받게 된다
      # (증분 수집의 장점이 사라짐). 파일이 상당히 크므로(수십 MB대)
      # 저장소 용량이 부담되면 이 줄만 빼면 기존 FDR 방식으로 자동 폴백된다.
      - name: Commit history and listing cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/
          git add -f cache/kr_listing.parquet cache/kr_listing.pkl 2>/dev/null || true
          git add -f cache/kr_krx_daily.parquet cache/kr_krx_daily.pkl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "history/cache 변경 없음 — 커밋 생략"
          else
            git commit -m "SEPA 스캔 결과 $(date -u +%F) [${{ steps.session.outputs.value }}]"
          fi
          # 스캔이 오래 걸리는 동안(한국 전종목이면 수십 분) 다른 곳(로컬 등)에서
          # history/ 에 파일을 올렸을 수 있다. 그걸 받아온 뒤에 매니페스트를
          # 다시 만들어야, 이번 실행이 시작된 시점엔 없었던 파일까지 반영된다.
          git pull --rebase origin main

      - name: Regenerate manifest (최종 상태 기준)
        run: python regen_manifest.py

      - name: Push
        run: |
          # manifest.json 뿐 아니라 history/ 전체를 담는다.
          # 매니페스트 재생성 과정에서 NFD(맥에서 만든 깨진 한글 파일명)를
          # NFC로 바꾸는 작업이 함께 일어나므로, 그 이름 변경도 커밋되어야 한다.
          git add -A history/
          if git diff --cached --quiet; then
            echo "history 변경 없음 — 커밋 생략"
          else
            git commit -m "매니페스트 갱신 및 파일명 정규화"
          fi
          git push

      - name: Build site
        run: |
          mkdir -p site
          cp history/SEPA대시보드_*.html site/ 2>/dev/null || true
          cp history/manifest.json site/ 2>/dev/null || true
          cp history/*.pdf site/ 2>/dev/null || true
          cp output/*.pdf  site/ 2>/dev/null || true

          # ls -t 는 mtime 순인데, checkout 직후에는 모든 파일의 mtime이
          # 방금 시각으로 새로 찍혀 원래 생성 순서를 잃는다.
          # 파일명이 SEPA대시보드_YYYYMMDD_AM|PM.html 형식이므로
          # 이름순 정렬이 곧 시간순이다. (같은 날은 AM < PM 으로 순서도 맞음)
          latest=$(ls history/SEPA대시보드_*.html | sort | tail -1)
          cp "$latest" site/index.html

          echo "=============================================="
          echo " 세션          : ${{ steps.session.outputs.value }}"
          echo " 배포 시각     : $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo " 배포 파일 수  : $(ls site/ | wc -l)"
          echo " PDF 개수      : $(ls site/*.pdf 2>/dev/null | wc -l)"
          echo " index.html    : $latest"
          echo "=============================================="

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
