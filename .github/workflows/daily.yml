name: SEPA Daily Scan

on:
  schedule:
    - cron: '20 22 * * 0-4'   # KST 07:20 (한국 장 시작 전) — UTC 일~목 22:20
    - cron: '30 7 * * 1-5'    # KST 16:30 (한국 장 마감 후) — UTC 월~금 07:30
  workflow_dispatch:
    inputs:
      session:
        description: '세션 구분 (수동 실행 시 표시될 이름)'
        required: false
        default: 'MANUAL'
        type: choice
        options: [AM, PM, MANUAL]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # 어떤 cron이 이 실행을 트리거했는지로 장전/장마감을 자동 판별한다.
      # 수동 실행(workflow_dispatch)이면 위에서 고른 선택지를 쓴다.
      - name: Determine session
        id: session
        run: |
          if [ "${{ github.event.schedule }}" = "20 22 * * 0-4" ]; then
            echo "value=AM" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 7 * * 1-5" ]; then
            echo "value=PM" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.session || 'MANUAL' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run scan
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python run_daily.py --market ALL --min-rs 90 --no-open --session ${{ steps.session.outputs.value }}

      # history/ 는 캐시가 아니라 저장소에 직접 커밋한다.
      # 캐시는 만료·초기화될 수 있어 "날짜별 조회"가 끊기는 원인이 됐었다.
      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/
          if git diff --cached --quiet; then
            echo "history 변경 없음 — 커밋 생략"
          else
            git commit -m "SEPA 스캔 결과 $(date -u +%F) [${{ steps.session.outputs.value }}]"
          fi
          # 스캔이 오래 걸리는 동안(한국 전종목이면 수십 분) 다른 곳(로컬 등)에서
          # history/ 에 파일을 올렸을 수 있다. 그걸 받아온 뒤에 매니페스트를
          # 다시 만들어야, 이번 실행이 시작된 시점엔 없었던 파일까지 반영된다.
          git pull --rebase origin main

      - name: Regenerate manifest (최종 상태 기준)
        run: python regen_manifest.py

      - name: Push
        run: |
          # manifest.json 뿐 아니라 history/ 전체를 담는다.
          # 매니페스트 재생성 과정에서 NFD(맥에서 만든 깨진 한글 파일명)를
          # NFC로 바꾸는 작업이 함께 일어나므로, 그 이름 변경도 커밋되어야 한다.
          git add -A history/
          if git diff --cached --quiet; then
            echo "history 변경 없음 — 커밋 생략"
          else
            git commit -m "매니페스트 갱신 및 파일명 정규화"
          fi
          git push

      - name: Build site
        run: |
          mkdir -p site
          cp history/SEPA대시보드_*.html site/ 2>/dev/null || true
          cp history/manifest.json site/ 2>/dev/null || true
          cp output/*.pdf site/ 2>/dev/null || true
          latest=$(ls -t history/SEPA대시보드_*.html | head -1)
          cp "$latest" site/index.html
          echo "세션: ${{ steps.session.outputs.value }}"
          echo "배포 파일 수: $(ls site/ | wc -l)"
          echo "최신 파일: $latest"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
