name: SEPA Deploy (배포만, 재스캔 없음)

on:
  push:
    branches: [main]
    paths:
      - 'history/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 매니페스트를 지금 폴더 상태 그대로 다시 만든다.
      # 이 과정에서 맥에서 올린 NFD(깨진 한글 파일명)가 NFC로 정리되어
      # 웹에서 열 수 있는 이름이 된다. 스캔은 하지 않으므로 몇 초면 끝난다.
      # 표준 라이브러리만 쓰는 독립 스크립트라 pip install 없이 바로 돈다.
      - name: Regenerate manifest & normalize filenames
        run: python regen_manifest.py

      - name: Commit normalized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A history/
          if git diff --cached --quiet; then
            echo "history 변경 없음 — 커밋 생략"
          else
            git commit -m "매니페스트 갱신 및 파일명 정규화"
            # 데일리 스캔이 같은 시각에 history/ 를 밀어넣었을 수 있다.
            # 먼저 받아오지 않으면 push 가 거절되어 배포 전체가 실패한다.
            git pull --rebase origin main
            git push
          fi

      - name: Build site from existing history/
        run: |
          mkdir -p site
          cp history/SEPA대시보드_*.html site/ 2>/dev/null || true
          cp history/manifest.json site/ 2>/dev/null || true

          # Pages 는 사이트 전체를 교체한다. 여기서 PDF를 담지 않으면
          # 직전 배포에 올라가 있던 PDF가 전부 사라져 링크가 404가 된다.
          # 저장 위치가 history/ 인지 output/ 인지 확실치 않아 둘 다 시도한다.
          cp history/*.pdf site/ 2>/dev/null || true
          cp output/*.pdf  site/ 2>/dev/null || true

          # ls -t 는 mtime 순인데, checkout 직후에는 모든 파일의 mtime이
          # 방금 시각으로 새로 찍혀 원래 생성 순서를 잃는다.
          # 파일명이 SEPA대시보드_YYYYMMDD_AM|PM.html 형식이므로
          # 이름순 정렬이 곧 시간순이다. (같은 날은 AM < PM 으로 순서도 맞음)
          latest=$(ls history/SEPA대시보드_*.html | sort | tail -1)
          cp "$latest" site/index.html

          echo "=============================================="
          echo " 배포 시각     : $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo " 배포 파일 수  : $(ls site/ | wc -l)"
          echo " PDF 개수      : $(ls site/*.pdf 2>/dev/null | wc -l)"
          echo " index.html    : $latest"
          echo "=============================================="

          if [ "$(ls site/*.pdf 2>/dev/null | wc -l)" -eq 0 ]; then
            echo "::warning::배포 대상에 PDF가 하나도 없습니다. history/ 와 output/ 어디에도 PDF가 없어 대시보드의 PDF 링크가 깨질 수 있습니다."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
