name: SEPA Deploy (배포만, 재스캔 없음)

on:
  push:
    branches: [main]
    paths:
      - 'history/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 매니페스트를 지금 폴더 상태 그대로 다시 만든다.
      # 이 과정에서 맥에서 올린 NFD(깨진 한글 파일명)가 NFC로 정리되어
      # 웹에서 열 수 있는 이름이 된다. 스캔은 하지 않으므로 몇 초면 끝난다.
      # 표준 라이브러리만 쓰는 독립 스크립트라 pip install 없이 바로 돈다.
      - name: Regenerate manifest & normalize filenames
        run: python regen_manifest.py

      - name: Commit normalized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A history/
          if git diff --cached --quiet; then
            echo "history 변경 없음 — 커밋 생략"
          else
            git commit -m "매니페스트 갱신 및 파일명 정규화"
            git push
          fi

      - name: Build site from existing history/
        run: |
          mkdir -p site
          cp history/SEPA대시보드_*.html site/ 2>/dev/null || true
          cp history/manifest.json site/ 2>/dev/null || true
          latest=$(ls -t history/SEPA대시보드_*.html | head -1)
          cp "$latest" site/index.html
          echo "배포 파일 수: $(ls site/ | wc -l)"
          echo "최신 파일: $latest"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
